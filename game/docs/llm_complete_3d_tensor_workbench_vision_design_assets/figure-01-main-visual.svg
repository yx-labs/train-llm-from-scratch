</g><text x="558" y="535" class="sub" text-anchor="middle">设计核心：3D 不是玄学表达，而是把 [B,T,C]、[H,T,T]、参数矩阵和梯度流看清楚。</text><rect x="70" y="550" width="1030" height="78" rx="12" fill="rgba(15, 31, 50, .78)" stroke="#315f94" stroke-width="1.5" /><text x="100" y="582" class="label" text-anchor="start">视觉边界</text><text x="205" y="582" class="small" text-anchor="start">✅ 真实计算流程、shape 标签、模块端口、数值检查、失败可诊断</text><text x="205" y="612" class="small" text-anchor="start">❌ AI 大脑、语义星云、随机光效、无法对应到真实运算的装饰线</text>
