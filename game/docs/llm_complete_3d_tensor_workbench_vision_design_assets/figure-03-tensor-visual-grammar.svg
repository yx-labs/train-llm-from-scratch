<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08111f"/>
    <stop offset="0.55" stop-color="#0b1d33"/>
    <stop offset="1" stop-color="#101827"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#15273c"/>
    <stop offset="1" stop-color="#0d1928"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4fc3ff"/>
    <stop offset="1" stop-color="#3568ff"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd166"/>
    <stop offset="1" stop-color="#ff7a45"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4ade80"/>
    <stop offset="1" stop-color="#14b8a6"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<g opacity="0.19" stroke="#8bb8ff" stroke-width="1">
  <line x1="0" y1="0" x2="0" y2="600"/><line x1="40" y1="0" x2="40" y2="600"/><line x1="80" y1="0" x2="80" y2="600"/><line x1="120" y1="0" x2="120" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/><line x1="280" y1="0" x2="280" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/><line x1="360" y1="0" x2="360" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="440" y1="0" x2="440" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/><line x1="520" y1="0" x2="520" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/><line x1="680" y1="0" x2="680" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/><line x1="760" y1="0" x2="760" y2="600"/><line x1="800" y1="0" x2="800" y2="600"/><line x1="840" y1="0" x2="840" y2="600"/><line x1="880" y1="0" x2="880" y2="600"/><line x1="920" y1="0" x2="920" y2="600"/><line x1="960" y1="0" x2="960" y2="600"/><line x1="1000" y1="0" x2="1000" y2="600"/><line x1="1040" y1="0" x2="1040" y2="600"/><line x1="1080" y1="0" x2="1080" y2="600"/><line x1="1120" y1="0" x2="1120" y2="600"/><line x1="1160" y1="0" x2="1160" y2="600"/>
  <line x1="0" y1="0" x2="1180" y2="0"/><line x1="0" y1="40" x2="1180" y2="40"/><line x1="0" y1="80" x2="1180" y2="80"/><line x1="0" y1="120" x2="1180" y2="120"/><line x1="0" y1="160" x2="1180" y2="160"/><line x1="0" y1="200" x2="1180" y2="200"/><line x1="0" y1="240" x2="1180" y2="240"/><line x1="0" y1="280" x2="1180" y2="280"/><line x1="0" y1="320" x2="1180" y2="320"/><line x1="0" y1="360" x2="1180" y2="360"/><line x1="0" y1="400" x2="1180" y2="400"/><line x1="0" y1="440" x2="1180" y2="440"/><line x1="0" y1="480" x2="1180" y2="480"/><line x1="0" y1="520" x2="1180" y2="520"/><line x1="0" y1="560" x2="1180" y2="560"/>
</g>
<style>
  text { font-family: Inter, 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif; fill: #e8f2ff; }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .small { font-size: 14px; fill: #b6c7dc; }
  .tiny { font-size: 11px; fill: #9fb4ce; }
  .title { font-size: 28px; font-weight: 700; }
  .sub { font-size: 16px; fill: #a8c7e8; }
  .label { font-size: 13px; fill: #d9ecff; font-weight: 600; }
  .port { fill: #061629; stroke: #60a5fa; stroke-width: 1.5; }
</style>
<text x="55" y="58" class="title" text-anchor="start">张量视觉语法：把 shape 变成可读的 3D 物体</text><text x="55" y="88" class="sub" text-anchor="start">玩家看到的每条线和每个方块都标注 dtype 与 shape。</text>
<g filter="url(#shadow)">
  <polygon points="90,190 108,172 268,172 250,190" fill="#21496e" stroke="#66bfff" stroke-width="1.2"/>
  <polygon points="250,190 268,172 268,220 250,238" fill="#102a43" stroke="#66bfff" stroke-width="1.2"/>
  <rect x="90" y="190" width="160" height="48" rx="7" fill="#173556" stroke="#66bfff" stroke-width="1.3"/>
  <text x="170.0" y="210.0" class="label" text-anchor="middle">Token IDs</text>
  <text x="170.0" y="231.0" class="tiny mono" text-anchor="middle">int[B,T]</text>
</g><line x1="275" y1="216" x2="360" y2="216" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" />
<g filter="url(#shadow)">
  <polygon points="380,164 406,138 616,138 590,164" fill="#26577f" stroke="#66bfff" stroke-width="1.2"/>
  <polygon points="590,164 616,138 616,243 590,269" fill="#102a43" stroke="#66bfff" stroke-width="1.2"/>
  <rect x="380" y="164" width="210" height="105" rx="7" fill="#173b5c" stroke="#66bfff" stroke-width="1.3"/>
  <text x="485.0" y="212.5" class="label" text-anchor="middle">Embedding Tensor</text>
  <text x="485.0" y="233.5" class="tiny mono" text-anchor="middle">float[B,T,C]</text>
</g><line x1="625" y1="216" x2="710" y2="216" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" />
<g filter="url(#shadow)">
  <polygon points="735,130 767,98 1017,98 985,130" fill="#1d6871" stroke="#5eead4" stroke-width="1.2"/>
  <polygon points="985,130 1017,98 1017,258 985,290" fill="#0d3539" stroke="#5eead4" stroke-width="1.2"/>
  <rect x="735" y="130" width="250" height="160" rx="7" fill="#17404c" stroke="#5eead4" stroke-width="1.3"/>
  <text x="860.0" y="206.0" class="label" text-anchor="middle">Attention Map Stack</text>
  <text x="860.0" y="227.0" class="tiny mono" text-anchor="middle">float[B,H,T,T]</text>
</g><text x="432" y="302" class="tiny mono" text-anchor="middle">T = sequence length</text><text x="542" y="135" class="tiny mono" text-anchor="middle">C = channels</text><text x="825" y="325" class="tiny mono" text-anchor="middle">H heads × T×T maps</text><rect x="95" y="400" width="285" height="115" rx="12" fill="rgba(22,50,76,.9)" stroke="#5fa8d3" stroke-width="1.5" /><text x="120" y="430" class="label" text-anchor="start">连线规则</text><text x="120" y="462" class="small" text-anchor="start">1. dtype 必须兼容</text><text x="120" y="490" class="small" text-anchor="start">2. shape 必须能广播或匹配</text><rect x="448" y="400" width="285" height="115" rx="12" fill="rgba(22,50,76,.9)" stroke="#5fa8d3" stroke-width="1.5" /><text x="473" y="430" class="label" text-anchor="start">调试信息</text><text x="473" y="462" class="small" text-anchor="start">点击任意 tensor：查看 min/max/mean</text><text x="473" y="490" class="small" text-anchor="start">支持抽样显示真实数值</text><rect x="800" y="400" width="285" height="115" rx="12" fill="rgba(22,50,76,.9)" stroke="#5fa8d3" stroke-width="1.5" /><text x="825" y="430" class="label" text-anchor="start">失败反馈</text><text x="825" y="462" class="small" text-anchor="start">错误不是“不可连接”</text><text x="825" y="490" class="small" text-anchor="start">而是显示 expected / received</text>
</svg>