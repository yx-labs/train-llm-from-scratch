<text x="55" y="56" class="title" text-anchor="start">Transformer Block：模块、旁路、稳定器必须可见</text><text x="55" y="85" class="sub" text-anchor="start">推荐采用 Pre-LN 可视结构；Residual 不是装饰线，而是明确的 Add 节点。</text><rect x="70" y="210" width="110" height="62" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="125.0" y="237" class="label" text-anchor="middle">x</text><text x="125.0" y="258" class="tiny mono" text-anchor="middle">[B,T,C]</text><rect x="190" y="210" width="140" height="62" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="260.0" y="237" class="label" text-anchor="middle">LayerNorm</text><text x="260.0" y="258" class="tiny mono" text-anchor="middle">mean/var</text><rect x="340" y="210" width="140" height="62" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="410.0" y="237" class="label" text-anchor="middle">Causal Self-Attn</text><text x="410.0" y="258" class="tiny mono" text-anchor="middle">[B,T,C]</text><rect x="520" y="210" width="110" height="62" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="575.0" y="237" class="label" text-anchor="middle">Add</text><text x="575.0" y="258" class="tiny mono" text-anchor="middle">residual</text><rect x="650" y="210" width="140" height="62" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="720.0" y="237" class="label" text-anchor="middle">LayerNorm</text><text x="720.0" y="258" class="tiny mono" text-anchor="middle">mean/var</text><rect x="800" y="210" width="110" height="62" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="855.0" y="237" class="label" text-anchor="middle">MLP</text><text x="855.0" y="258" class="tiny mono" text-anchor="middle">C→4C→C</text><rect x="960" y="210" width="110" height="62" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="1015.0" y="237" class="label" text-anchor="middle">Add</text><text x="1015.0" y="258" class="tiny mono" text-anchor="middle">residual</text><line x1="180" y1="241" x2="190" y2="241" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="300" y1="241" x2="340" y2="241" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="480" y1="241" x2="520" y2="241" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="630" y1="241" x2="650" y2="241" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="760" y1="241" x2="800" y2="241" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="910" y1="241" x2="960" y2="241" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><path d="M125 210 C125 140 540 140 575 210" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M575 272 C575 340 970 340 1015 272" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="225" y="365" width="730" height="86" rx="12" fill="rgba(15,31,50,.86)" stroke="#315f94" stroke-width="1.5" /><text x="255" y="398" class="label" text-anchor="start">通过条件</text><text x="365" y="398" class="small" text-anchor="start">Input / Output shape 不变；Attention、MLP 各有 residual；LayerNorm 位置清晰；每个参数矩阵能展开查看。</text><text x="365" y="425" class="small" text-anchor="start">缺失 residual：深层训练稳定性下降；缺失 norm：activation/gradient 可能爆炸或 NaN。</text>
</svg>