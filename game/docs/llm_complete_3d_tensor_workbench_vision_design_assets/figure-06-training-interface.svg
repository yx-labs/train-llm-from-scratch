<text x="55" y="54" class="title" text-anchor="start">训练视图：Forward / Backward / Optimizer 是同一台机器的两种流向</text><text x="55" y="82" class="sub" text-anchor="start">玩家不是只看 loss 曲线，而是看到梯度怎样回流、参数怎样被更新。</text><rect x="80" y="190" width="120" height="64" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="140" y="217" class="label" text-anchor="middle">Batch</text><text x="140" y="239" class="tiny mono" text-anchor="middle">tokens</text><rect x="230" y="190" width="120" height="64" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="290" y="217" class="label" text-anchor="middle">Forward</text><text x="290" y="239" class="tiny mono" text-anchor="middle">model</text><rect x="390" y="190" width="120" height="64" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="450" y="217" class="label" text-anchor="middle">Logits</text><text x="450" y="239" class="tiny mono" text-anchor="middle">[B,T,V]</text><rect x="540" y="190" width="120" height="64" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="600" y="217" class="label" text-anchor="middle">Cross Entropy</text><text x="600" y="239" class="tiny mono" text-anchor="middle">loss</text><rect x="705" y="190" width="120" height="64" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="765" y="217" class="label" text-anchor="middle">Backward</text><text x="765" y="239" class="tiny mono" text-anchor="middle">grads</text><rect x="865" y="190" width="120" height="64" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="925" y="217" class="label" text-anchor="middle">AdamW Step</text><text x="925" y="239" class="tiny mono" text-anchor="middle">params</text><line x1="208" y1="222" x2="222" y2="222" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow)" /><line x1="358" y1="222" x2="382" y2="222" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow)" /><line x1="518" y1="222" x2="532" y2="222" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow)" /><line x1="668" y1="222" x2="697" y2="222" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow)" /><line x1="833" y1="222" x2="857" y2="222" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M925 270 C850 360 415 360 290 270" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="590" y="378" class="tiny mono" text-anchor="middle" fill="#fbbf24">gradient flow</text><rect x="90" y="410" width="1000" height="126" rx="12" fill="rgba(9,20,34,.9)" stroke="#334d67" stroke-width="1.5" /><text x="125" y="448" class="tiny mono" text-anchor="start">step</text><text x="125" y="482" class="label" text-anchor="start">1280</text><rect x="115" y="458" width="100" height="42" rx="6" fill="rgba(27,45,67,.7)" stroke="#284f79" stroke-width="1.5" /><text x="260" y="448" class="tiny mono" text-anchor="start">train loss</text><text x="260" y="482" class="label" text-anchor="start">3.42</text><rect x="250" y="458" width="100" height="42" rx="6" fill="rgba(27,45,67,.7)" stroke="#284f79" stroke-width="1.5" /><text x="395" y="448" class="tiny mono" text-anchor="start">val loss</text><text x="395" y="482" class="label" text-anchor="start">3.88</text><rect x="385" y="458" width="100" height="42" rx="6" fill="rgba(27,45,67,.7)" stroke="#284f79" stroke-width="1.5" /><text x="530" y="448" class="tiny mono" text-anchor="start">lr</text><text x="530" y="482" class="label" text-anchor="start">3e-4</text><rect x="520" y="458" width="100" height="42" rx="6" fill="rgba(27,45,67,.7)" stroke="#284f79" stroke-width="1.5" /><text x="665" y="448" class="tiny mono" text-anchor="start">grad norm</text><text x="665" y="482" class="label" text-anchor="start">1.72</text><rect x="655" y="458" width="100" height="42" rx="6" fill="rgba(27,45,67,.7)" stroke="#284f79" stroke-width="1.5" /><text x="800" y="448" class="tiny mono" text-anchor="start">toke