<text x="55" y="56" class="title" text-anchor="start">推理采样台：Logits 到 Token 的每一步都可调试</text><text x="55" y="86" class="sub" text-anchor="start">Temperature、top-k、top-p 不做成“创意魔法”，而是概率分布的可视化处理链。</text><rect x="70" y="180" width="130" height="58" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="135" y="205" class="label" text-anchor="middle">Logits</text><text x="135" y="225" class="tiny mono" text-anchor="middle">raw scores</text><rect x="230" y="180" width="130" height="58" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="295" y="205" class="label" text-anchor="middle">/ Temperature</text><text x="295" y="225" class="tiny mono" text-anchor="middle">T=0.8</text><rect x="410" y="180" width="130" height="58" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="475" y="205" class="label" text-anchor="middle">Softmax</text><text x="475" y="225" class="tiny mono" text-anchor="middle">prob sum=1</text><rect x="570" y="180" width="130" height="58" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="635" y="205" class="label" text-anchor="middle">Top-k</text><text x="635" y="225" class="tiny mono" text-anchor="middle">k=5</text><rect x="730" y="180" width="130" height="58" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="795" y="205" class="label" text-anchor="middle">Top-p</text><text x="795" y="225" class="tiny mono" text-anchor="middle">p=0.9</text><rect x="890" y="180" width="130" height="58" rx="8" fill="rgba(23,58,87,.95)" stroke="#7dd3fc" stroke-width="1.5" /><text x="955" y="205" class="label" text-anchor="middle">Sample</text><text x="955" y="225" class="tiny mono" text-anchor="middle">multinomial</text><line x1="208" y1="209" x2="222" y2="209" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="368" y1="209" x2="402" y2="209" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="548" y1="209" x2="562" y2="209" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="708" y1="209" x2="722" y2="209" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><line x1="868" y1="209" x2="882" y2="209" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" /><rect x="150" y="297" width="62" height="93" fill="#38bdf8" rx="5" opacity="0.9"/><text x="181" y="416" class="tiny mono" text-anchor="middle">the</text><text x="181" y="287" class="tiny mono" text-anchor="middle">0.31</text><rect x="255" y="324" width="62" height="66" fill="#38bdf8" rx="5" opacity="0.9"/><text x="286" y="416" class="tiny mono" text-anchor="middle">a</text><text x="286" y="314" class="tiny mono" text-anchor="middle">0.22</text><rect x="360" y="342" width="62" height="48" fill="#38bdf8" rx="5" opacity="0.9"/><text x="391" y="416" class="tiny mono" text-anchor="middle">cat</text><text x="391" y="332" class="tiny mono" text-anchor="middle">0.16</text><rect x="465" y="360" width="62" height="30" fill="#38bdf8" rx="5" opacity="0.9"/><text x="496" y="416" class="tiny mono" text-anchor="middle">dog</text><text x="496" y="350" class="tiny mono" text-anchor="middle">0.10</text><rect x="570" y="366" width="62" height="24" fill="#38bdf8" rx="5" opacity="0.9"/><text x="601" y="416" class="tiny mono" text-anchor="middle">mat</text><text x="601" y="356" class="tiny mono" text-anchor="middle">0.08</text><rect x="675" y="381" width="62" height="9" fill="#475569" rx="5" opacity="0.9"/><text x="706" y="416" class="tiny mono" text-anchor="middle">river</text><text x="706" y="371" class="tiny mono" text-anchor="middle">0.03</text><rect x="780" y="384" width="62" height="6" fill="#475569" rx="5" opacity="0.9"/><text x="811" y="416" class="tiny mono" text-anchor="middle">blue</text><text x="811" y="374" class="tiny mono" text-anchor="middle">0.02</text><rect x="885" y="387" width="62" height="3" fill="#475569" rx="5" opacity="0.9"/><text x="916" y="416" class="tiny mono" text-anchor="m