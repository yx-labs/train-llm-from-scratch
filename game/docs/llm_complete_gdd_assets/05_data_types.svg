  .warn { fill: rgba(127,29,29,.85); stroke:#fb7185; stroke-width:1.4; }
  .line { fill:none; stroke:#7dd3fc; stroke-width:2.2; marker-end:url(#arrow); }
  .lineo { fill:none; stroke:#fbbf24; stroke-width:2.2; marker-end:url(#arrowO); }
  .dim { opacity:.55; }
</style>
