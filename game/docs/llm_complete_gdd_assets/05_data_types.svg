<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0a1a2d"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#162941"/><stop offset="1" stop-color="#0c1929"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#53c7ff"/><stop offset="1" stop-color="#346bff"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff7a45"/>
