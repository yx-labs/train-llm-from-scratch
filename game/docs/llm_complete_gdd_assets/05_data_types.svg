</g><text x="60" y="78" class="title">端口与数据类型 / Ports &amp; Tensor Types</text><text x="60" y="108" class="sub">所有连线都带 dtype、shape、value range；错误从这里开始被发现</text><rect x="90" y="150" width="1000" height="48" rx="8" class="box2" filter="url(#shadow)"/><text x="120" y="179" class="label mono">raw_text</text><text x="315" y="179" class="tiny mono">string</text><text x="510" y="179" class="small">文本输入，不可直接进入模型</text><rect x="90" y="208" width="1000" height="48" rx="8" class="box" filter="url(#shadow)"/><text x="120" y="237" class="label mono">token_ids</text><text x="315" y="237" class="tiny mono">int[B,T]</text><text x="510" y="237" class="small">tokenizer 输出；embedding 的地址信号</text><rect x="90" y="266" width="1000" height="48" rx="8" class="boxg" filter="url(#shadow)"/><text x="120" y="295" class="label mono">activation</text><text x="315" y="295" class="tiny mono">float[B,T,C]</text><text x="510" y="295" class="small">主干隐藏状态；block 输入输出保持此形状</text><rect x="90" y="324" width="1000" height="48" rx="8" class="boxp" filter="url(#shadow)"/><text x="120" y="353" class="label mono">attn_score</text><text x="315" y="353" class="tiny mono">float[B,H,T,T]</text><text x="510" y="353" class="small">QKᵀ 得分；mask 与 softmax 作用对象</text><rect x="90" y="382" width="1000" height="48" rx="8" class="boxo" filter="url(#shadow)"/><text x="120" y="411" class="label mono">logits</text><text x="315" y="411" class="tiny mono">float[B,T,V]</text><text x="510" y="411" class="small">LM Head 输出；进入 cross entropy 或 sampling</text><rect x="90" y="440" width="1000" height="48" rx="8" class="warn" filter="url(#shadow)"/><text x="120" y="469" class="label mono">loss</text><text x="315" y="469" class="tiny mono">scalar</text><text x="510" y="469" class="small">训练目标；backward 的起点</text><rect x="90" y="498" width="1000" height="48" rx="8" class="boxo" filter="url(#shadow)"/><text x="120" y="527" class="label mono">gradient</text><text x="315" y="527" class="tiny mono">float_like(param)</text><text x="510" y="527" class="small">反向传播产生；optimizer 消费</text><rect x="90" y="556" width="1000" height="48" rx="8" class="box2" filter="url(#shadow)"/><text x="120" y="585" class="label mono">parameter</text><text x="315" y="585" class="tiny mono">learnable tensor</text><text x="510" y="585" class="small">权重矩阵；可冻结、更新、保存 checkpoint</text><text x="90" y="640" class="small">设计原则：shape 标签永远可见；数值细节默认折叠，但在 Trace Mode 中可逐层展开。</text></svg>