<text x="125" y="370" class="h">关卡链条</text>
<text x="125" y="405" class="tiny mono">1. LayerNorm → 2. QKV Linear → 3. Split Heads → 4. Q @ K.T → 5. Scale → 6. Causal Mask</text>
<text x="125" y="435" class="tiny mono">7. Softmax Row Sum → 8. Attn @ V → 9. Merge Heads → 10. Output Linear → 11. Residual Add → 12. MLP</text>
<text x="125" y="480" class="small">样片的胜利条件不是“表现完整 LLM”，而是证明核心玩法成立：</text>
<text x="125" y="512" class="small">玩家能通过搭建、失败、单步追踪和自动测试，真正理解一个 Transformer Block 如何工作。</text>
